<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Chennai Car Simulator</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block}#hud{position:fixed;top:8px;left:10px;right:100px;pointer-events:none;text-shadow:0 1px 3px #000}#road{font-size:20px;font-weight:700}#near{font-size:14px}#spd{position:fixed;top:8px;right:10px;font-size:22px;font-weight:700;text-shadow:0 1px 3px #000}.b{position:fixed;bottom:22px;width:82px;height:82px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);font-size:30px;display:flex;align-items:center;justify-content:center}#menu{position:fixed;inset:0;background:rgba(10,15,25,.94);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:28px 16px;text-align:center;overflow-y:auto;touch-action:pan-y}#pl{display:grid;grid-template-columns:1fr 1fr;gap:8px}#menu button{width:150px;padding:12px 4px;font-size:15px;border:0;border-radius:10px;background:#e8a317;color:#111;font-weight:700}#msg{min-height:22px;font-size:14px}#mb,#lg{position:fixed;top:44px;padding:6px 10px;background:rgba(0,0,0,.4);border-radius:8px;font-size:13px;z-index:5}#mb{right:10px}#lg{right:76px}#att{position:fixed;bottom:2px;left:50%;transform:translateX(-50%);font-size:10px;opacity:.7;pointer-events:none}</style></head><body><div id='hud'><div id='road'>-</div><div id='near'></div></div><div id='spd'>0 km/h</div><div id='mb'>Menu</div><div id='lg'>தமிழ்</div><div class='b' id='bl' style='left:14px'>◀</div><div class='b' id='br' style='left:108px'>▶</div><div class='b' id='bg' style='right:14px'>▲</div><div class='b' id='bb' style='right:108px'>▼</div><div id='att'>Map data © OpenStreetMap contributors</div><div id='menu'><h2>Chennai Car Simulator</h2><div>Drive real Chennai roads with real road, building and shop names (OpenStreetMap). Needs internet.</div><div id='pl'></div><div id='msg'></div></div><script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'></script><script>const $=id=>document.getElementById(id);const PL={'T. Nagar':[13.0418,80.2341],'Marina Beach':[13.0500,80.2824],'Mylapore':[13.0339,80.2698],'Adyar':[13.0067,80.2575],'Guindy':[13.0067,80.2206],'Anna Nagar':[13.0850,80.2101],'Egmore':[13.0732,80.2609],'Nungambakkam':[13.0569,80.2425],'Kodambakkam':[13.0507,80.2250],'Vadapalani':[13.0500,80.2121],'Besant Nagar':[13.0002,80.2668],'Triplicane':[13.0580,80.2745],'Chennai Central':[13.0827,80.2757],'Koyambedu':[13.0694,80.1948],'Perambur':[13.1143,80.2329],'Velachery':[12.9791,80.2212],'Sholinganallur':[12.9010,80.2279],'Tambaram':[12.9249,80.1000]};const EP=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];let LANG='en',lastData=null;const nameOf=p=>p[LANG==='ta'?1:0];const nmOf=t=>{const en=t['name:en']||t.name||t.ref||'Unnamed road';return[en,t['name:ta']||t.name||en]};const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.body.prepend(ren.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ad0f0);scene.fog=new THREE.Fog(0x9ad0f0,150,900);const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.5,1500);scene.add(new THREE.AmbientLight(0xffffff,0.7));const sun=new THREE.DirectionalLight(0xffffff,0.6);sun.position.set(50,100,30);scene.add(sun);addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});const mk=(g,c)=>new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:c}));const car=new THREE.Group();const body=mk(new THREE.BoxGeometry(2,0.7,4.2),0xd62828);body.position.y=0.7;car.add(body);const cab=mk(new THREE.BoxGeometry(1.7,0.6,2),0x222a35);cab.position.set(0,1.3,-0.2);car.add(cab);for(const [wx,wz] of [[1,1.4],[-1,1.4],[1,-1.4],[-1,-1.4]]){const w=mk(new THREE.CylinderGeometry(0.4,0.4,0.3,12),0x111111);w.rotation.z=Math.PI/2;w.position.set(wx,0.4,wz);car.add(w)}scene.add(car);let world=null,segs=[],shops=[],ways=[],ai=[],x=0,z=0,h=0,v=0,run=false,P=PL['T. Nagar'],fr=0;const K={l:0,r:0,g:0,b:0};const proj=(la,lo)=>[(lo-P[1])*111320*Math.cos(P[0]*Math.PI/180),-(la-P[0])*110540];function label(t,color,sz){const c=document.createElement('canvas');let g=c.getContext('2d');g.font='bold 40px sans-serif';const w=Math.min(700,Math.ceil(g.measureText(t).width)+30);c.width=w;c.height=64;g=c.getContext('2d');g.font='bold 40px sans-serif';g.fillStyle=color;g.fillRect(0,0,w,64);g.fillStyle='#fff';g.textBaseline='middle';g.fillText(t,15,34);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));s.renderOrder=10;s.scale.set(w/64*sz,sz,1);return s}function hue(n){let k=0;for(const ch of n)k=(k*31+ch.charCodeAt(0))|0;return new THREE.Color().setHSL((Math.abs(k)%360)/360,0.55,0.5)}function dseg(px,pz,s){const dx=s[2]-s[0],dz=s[3]-s[1];let t=((px-s[0])*dx+(pz-s[1])*dz)/(dx*dx+dz*dz||1);t=Math.max(0,Math.min(1,t));const cx=s[0]+t*dx-px,cz=s[1]+t*dz-pz;return cx*cx+cz*cz}async function load(lat,lon){const R=900;const q=`[out:json][timeout:30];(way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street)$"](around:${R},${lat},${lon});way["building"](around:420,${lat},${lon});node["shop"]["name"](around:${R},${lat},${lon});node["amenity"~"^(restaurant|cafe|fast_food|bank|pharmacy|hospital|fuel|cinema|place_of_worship)$"]["name"](around:${R},${lat},${lon}););out geom;`;for(const u of EP){try{const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q)});if(!r.ok)continue;return await r.json()}catch(err){}}throw new Error('net')}function build(data,keep){if(world)scene.remove(world);world=new THREE.Group();scene.add(world);segs=[];shops=[];ways=[];ai=[];const gr=mk(new THREE.PlaneGeometry(8000,8000),0x6b8a5a);gr.rotation.x=-Math.PI/2;world.add(gr);const pos=[],col=[],names=new Map(),sh=[],bl=[];const WD={motorway:16,trunk:14,primary:12,secondary:10,tertiary:9};for(const e of data.elements){const t=e.tags||{};const nm=nmOf(t);if(e.type==='way'&&e.geometry&&t.highway){const pts=e.geometry.map(p=>proj(p.lat,p.lon));const w=WD[t.highway]||7;const c=WD[t.highway]?[0.32,0.34,0.4]:[0.23,0.25,0.29];const cu=[0];for(let i=1;i<pts.length;i++)cu.push(cu[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));if(cu[cu.length-1]>60)ways.push({pts:pts,cum:cu,w:w});for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];let dx=b[0]-a[0],dz=b[1]-a[1];const L=Math.hypot(dx,dz);if(L<0.01)continue;dx/=L;dz/=L;const ex=w*0.3;const ax=a[0]-dx*ex,az=a[1]-dz*ex,bx=b[0]+dx*ex,bz=b[1]+dz*ex,nx=-dz*w/2,nz=dx*w/2;pos.push(ax+nx,0.1,az+nz,ax-nx,0.1,az-nz,bx+nx,0.1,bz+nz,ax-nx,0.1,az-nz,bx-nx,0.1,bz-nz,bx+nx,0.1,bz+nz);for(let k=0;k<6;k++)col.push(c[0],c[1],c[2]);segs.push([a[0],a[1],b[0],b[1],nm])}if((t.name||t['name:en'])&&!names.has(nm[0])&&pts.length){names.set(nm[0],{p:pts[pts.length>>1],n:nm})}}else if(e.type==='way'&&e.geometry&&t.building){let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;for(const gp of e.geometry){const p=proj(gp.lat,gp.lon);if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<z0)z0=p[1];if(p[1]>z1)z1=p[1]}const bw=Math.max(3,(x1-x0)*0.85),bd=Math.max(3,(z1-z0)*0.85);const lv=parseFloat(t['building:levels']);const cx=(x0+x1)/2,cz=(z0+z1)/2;if(bw*bd<8000)bl.push({x:cx,z:cz,w:bw,d:bd,h:lv?Math.min(60,lv*3.2):6+Math.floor(Math.abs(cx*7+cz*3))%9})}else if(e.type==='node'&&e.lat&&(t.name||t['name:en'])){const p=proj(e.lat,e.lon);sh.push([p[0],p[1],nm])}}if(!segs.length)throw new Error('empty');const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));world.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2})));if(bl.length){const bs=bl.slice(0,2500);const im=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({color:0xffffff}),bs.length);const m4=new THREE.Matrix4(),cl=new THREE.Color();bs.forEach((b,i)=>{m4.makeScale(b.w,b.h,b.d);m4.setPosition(b.x,b.h/2,b.z);im.setMatrixAt(i,m4);cl.setHSL(0.06+((i*37)%10)/100,0.18,0.5+((i*53)%25)/100);im.setColorAt(i,cl)});im.instanceMatrix.needsUpdate=true;if(im.instanceColor)im.instanceColor.needsUpdate=true;im.frustumCulled=false;world.add(im)}const d0=p=>p[0]*p[0]+p[1]*p[1];[...names.values()].sort((a,b)=>d0(a.p)-d0(b.p)).slice(0,45).forEach(o=>{const s=label(nameOf(o.n),'rgba(20,90,160,.9)',3);s.position.set(o.p[0],10,o.p[1]);world.add(s)});sh.sort((a,b)=>d0(a)-d0(b));sh.slice(0,80).forEach(p=>{const b=mk(new THREE.CylinderGeometry(0.4,0.4,8,6),hue(p[2][0]));b.position.set(p[0],4,p[1]);world.add(b);const s=label(nameOf(p[2]),'rgba(160,60,20,.9)',2.4);s.position.set(p[0],10,p[1]);world.add(s);shops.push(p)});const AC=[0xf2f2f2,0xf4c20d,0x2b6cb0,0x333333,0x2f9e44,0xe8590c];for(let i=0;i<Math.min(30,ways.length*2);i++){const wy=ways[Math.floor(Math.random()*ways.length)];const gg=new THREE.Group();const b=mk(new THREE.BoxGeometry(1.9,0.7,4),AC[i%AC.length]);b.position.y=0.7;gg.add(b);const c=mk(new THREE.BoxGeometry(1.6,0.55,1.9),0x222a35);c.position.set(0,1.28,-0.2);gg.add(c);world.add(gg);ai.push({g:gg,wy:wy,s:Math.random()*wy.cum[wy.cum.length-1],dir:Math.random()<0.5?1:-1,sp:5+Math.random()*6,x:-9999,z:-9999})}if(!keep){let bi=0,bd=1e18;segs.forEach((s,i)=>{const d=dseg(0,0,s);if(d<bd){bd=d;bi=i}});const s0=segs[bi];x=(s0[0]+s0[2])/2;z=(s0[1]+s0[3])/2;h=Math.atan2(s0[2]-s0[0],s0[3]-s0[1]);v=0;cam.position.set(x-Math.sin(h)*11,5,z-Math.cos(h)*11)}}function stepAI(a,dt){const cu=a.wy.cum,p=a.wy.pts,L=cu[cu.length-1];a.s+=a.dir*a.sp*dt;if(a.s<0){a.s=0;a.dir=1}else if(a.s>L){a.s=L;a.dir=-1}let k=0;while(k<cu.length-2&&cu[k+1]<a.s)k++;const l=cu[k+1]-cu[k]||1,t=(a.s-cu[k])/l;const fx=(p[k+1][0]-p[k][0])/l*a.dir,fz=(p[k+1][1]-p[k][1])/l*a.dir;const o=Math.min(2.2,a.wy.w*0.22);a.x=p[k][0]+t*(p[k+1][0]-p[k][0])+fz*o;a.z=p[k][1]+t*(p[k+1][1]-p[k][1])-fx*o;a.g.position.set(a.x,0,a.z);a.g.rotation.y=Math.atan2(fx,fz)}async function start(n){P=PL[n];$('msg').textContent='Loading real map of '+n+'...';try{const d=await load(P[0],P[1]);lastData=d;build(d,false);$('menu').style.display='none';run=true;$('msg').textContent=''}catch(err){$('msg').textContent='Could not load map data. Check your internet and try again.'}}function hud(){let rb=1e18,rn='-',sb=1e18,sn='';for(const s of segs){const d=dseg(x,z,s);if(d<rb){rb=d;rn=nameOf(s[4])}}for(const s of shops){const d=(s[0]-x)**2+(s[1]-z)**2;if(d<sb){sb=d;sn=nameOf(s[2])}}$('road').textContent=rb<225?rn:(LANG==='ta'?'சாலைக்கு வெளியே':'Off road');$('near').textContent=sb<3600?(LANG==='ta'?'அருகில்: ':'Near: ')+sn:'';$('spd').textContent=Math.round(Math.abs(v)*3.6)+' km/h'}let last=performance.now();function tick(now){requestAnimationFrame(tick);const dt=Math.min(0.05,(now-last)/1000);last=now;if(run){if(K.g)v+=(v<0?20:11)*dt;else if(K.b)v-=(v>0?22:6)*dt;else{const f=4*dt;v=Math.abs(v)<f?0:v-Math.sign(v)*f}v=Math.max(-8,Math.min(28,v));const st=K.l-K.r;if(Math.abs(v)>0.3)h+=st*1.5*dt*Math.sign(v)*Math.min(1,Math.abs(v)/5);x+=Math.sin(h)*v*dt;z+=Math.cos(h)*v*dt;for(const a of ai){stepAI(a,dt);const dd=(a.x-x)**2+(a.z-z)**2;if(dd<10.24){const d=Math.sqrt(dd)||1;x+=(x-a.x)/d*(3.2-d);z+=(z-a.z)/d*(3.2-d);if(Math.abs(v)>2)v*=-0.3}}car.position.set(x,0,z);car.rotation.y=h;const fx=Math.sin(h),fz=Math.cos(h),k=Math.min(1,dt*5);cam.position.x+=(x-fx*11-cam.position.x)*k;cam.position.z+=(z-fz*11-cam.position.z)*k;cam.position.y=5;cam.lookAt(x+fx*5,1,z+fz*5);if(++fr%6===0)hud()}ren.render(scene,cam)}requestAnimationFrame(tick);for(const [id,k] of [['bl','l'],['br','r'],['bg','g'],['bb','b']]){const el=$(id);const on=e=>{e.preventDefault();K[k]=1};const off=e=>{e.preventDefault();K[k]=0};el.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,off))}const KM={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'g',w:'g',ArrowDown:'b',s:'b'};addEventListener('keydown',e=>{if(KM[e.key])K[KM[e.key]]=1});addEventListener('keyup',e=>{if(KM[e.key])K[KM[e.key]]=0});$('mb').onclick=()=>{$('menu').style.display='flex';run=false;K.l=K.r=K.g=K.b=0};$('lg').onclick=()=>{LANG=LANG==='en'?'ta':'en';$('lg').textContent=LANG==='en'?'தமிழ்':'English';if(lastData){build(lastData,true);hud()}};for(const n in PL){const b=document.createElement('button');b.textContent=n;b.onclick=()=>start(n);$('pl').appendChild(b)}</script></body></html>
