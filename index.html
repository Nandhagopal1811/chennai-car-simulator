<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Chennai Car Simulator</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block}#hud{position:fixed;top:8px;left:10px;right:100px;pointer-events:none;text-shadow:0 1px 3px #000}#road{font-size:20px;font-weight:700}#near{font-size:14px}#spd{position:fixed;top:8px;right:10px;font-size:22px;font-weight:700;text-shadow:0 1px 3px #000}.b{position:fixed;bottom:22px;width:82px;height:82px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);font-size:30px;display:flex;align-items:center;justify-content:center}#menu{position:fixed;inset:0;background:rgba(10,15,25,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}#pl{display:flex;flex-direction:column;gap:8px}#menu button{width:240px;padding:12px;font-size:17px;border:0;border-radius:10px;background:#e8a317;color:#111;font-weight:700}#msg{min-height:22px;font-size:14px}#mb{position:fixed;top:44px;right:10px;padding:6px 10px;background:rgba(0,0,0,.4);border-radius:8px;font-size:13px}#att{position:fixed;bottom:2px;left:50%;transform:translateX(-50%);font-size:10px;opacity:.7;pointer-events:none}</style></head><body><div id='hud'><div id='road'>-</div><div id='near'></div></div><div id='spd'>0 km/h</div><div id='mb'>Menu</div><div class='b' id='bl' style='left:14px'>◀</div><div class='b' id='br' style='left:108px'>▶</div><div class='b' id='bg' style='right:14px'>▲</div><div class='b' id='bb' style='right:108px'>▼</div><div id='att'>Map data © OpenStreetMap contributors</div><div id='menu'><h2>Chennai Car Simulator</h2><div>Drive real Chennai roads with real road and shop names (OpenStreetMap). Needs internet.</div><div id='pl'></div><div id='msg'></div></div><script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'></script><script>const $=id=>document.getElementById(id);const PL={'T. Nagar':[13.0418,80.2341],'Marina Beach':[13.0500,80.2824],'Mylapore':[13.0339,80.2698],'Adyar':[13.0067,80.2575],'Guindy':[13.0067,80.2206],'Anna Nagar':[13.0850,80.2101],'Egmore':[13.0732,80.2609]};const EP=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.body.prepend(ren.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ad0f0);scene.fog=new THREE.Fog(0x9ad0f0,150,900);const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.5,1500);scene.add(new THREE.AmbientLight(0xffffff,0.7));const sun=new THREE.DirectionalLight(0xffffff,0.6);sun.position.set(50,100,30);scene.add(sun);addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});const mk=(g,c)=>new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:c}));const car=new THREE.Group();const body=mk(new THREE.BoxGeometry(2,0.7,4.2),0xd62828);body.position.y=0.7;car.add(body);const cab=mk(new THREE.BoxGeometry(1.7,0.6,2),0x222a35);cab.position.set(0,1.3,-0.2);car.add(cab);for(const [wx,wz] of [[1,1.4],[-1,1.4],[1,-1.4],[-1,-1.4]]){const w=mk(new THREE.CylinderGeometry(0.4,0.4,0.3,12),0x111111);w.rotation.z=Math.PI/2;w.position.set(wx,0.4,wz);car.add(w)}scene.add(car);let world=null,segs=[],shops=[],x=0,z=0,h=0,v=0,run=false,P=PL['T. Nagar'],fr=0;const K={l:0,r:0,g:0,b:0};const proj=(la,lo)=>[(lo-P[1])*111320*Math.cos(P[0]*Math.PI/180),-(la-P[0])*110540];function label(t,color,sz){const c=document.createElement('canvas');let g=c.getContext('2d');g.font='bold 40px sans-serif';const w=Math.min(700,Math.ceil(g.measureText(t).width)+30);c.width=w;c.height=64;g=c.getContext('2d');g.font='bold 40px sans-serif';g.fillStyle=color;g.fillRect(0,0,w,64);g.fillStyle='#fff';g.textBaseline='middle';g.fillText(t,15,34);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));s.renderOrder=10;s.scale.set(w/64*sz,sz,1);return s}function hue(n){let k=0;for(const ch of n)k=(k*31+ch.charCodeAt(0))|0;return new THREE.Color().setHSL((Math.abs(k)%360)/360,0.55,0.5)}function dseg(px,pz,s){const dx=s[2]-s[0],dz=s[3]-s[1];let t=((px-s[0])*dx+(pz-s[1])*dz)/(dx*dx+dz*dz||1);t=Math.max(0,Math.min(1,t));const cx=s[0]+t*dx-px,cz=s[1]+t*dz-pz;return cx*cx+cz*cz}async function load(lat,lon){const R=900;const q=`[out:json][timeout:25];(way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street)$"](around:${R},${lat},${lon});node["shop"]["name"](around:${R},${lat},${lon});node["amenity"~"^(restaurant|cafe|fast_food|bank|pharmacy|hospital|fuel|cinema|place_of_worship)$"]["name"](around:${R},${lat},${lon}););out geom 3000;`;for(const u of EP){try{const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q)});if(!r.ok)continue;return await r.json()}catch(err){}}throw new Error('net')}function build(data){if(world)scene.remove(world);world=new THREE.Group();scene.add(world);segs=[];shops=[];const gr=mk(new THREE.PlaneGeometry(8000,8000),0x6b8a5a);gr.rotation.x=-Math.PI/2;world.add(gr);const pos=[],col=[],names=new Map(),sh=[];const WD={motorway:16,trunk:14,primary:12,secondary:10,tertiary:9};for(const e of data.elements){const t=e.tags||{};const nm=t['name:en']||t.name||t.ref||'Unnamed road';if(e.type==='way'&&e.geometry&&t.highway){const pts=e.geometry.map(p=>proj(p.lat,p.lon));const w=WD[t.highway]||7;const c=WD[t.highway]?[0.32,0.34,0.4]:[0.23,0.25,0.29];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];let dx=b[0]-a[0],dz=b[1]-a[1];const L=Math.hypot(dx,dz);if(L<0.01)continue;dx/=L;dz/=L;const ex=w*0.3;const ax=a[0]-dx*ex,az=a[1]-dz*ex,bx=b[0]+dx*ex,bz=b[1]+dz*ex,nx=-dz*w/2,nz=dx*w/2;pos.push(ax+nx,0.1,az+nz,ax-nx,0.1,az-nz,bx+nx,0.1,bz+nz,ax-nx,0.1,az-nz,bx-nx,0.1,bz-nz,bx+nx,0.1,bz+nz);for(let k=0;k<6;k++)col.push(c[0],c[1],c[2]);segs.push([a[0],a[1],b[0],b[1],nm])}if((t.name||t['name:en'])&&!names.has(nm)&&pts.length){names.set(nm,pts[pts.length>>1])}}else if(e.type==='node'&&e.lat&&(t.name||t['name:en'])){const p=proj(e.lat,e.lon);sh.push([p[0],p[1],nm])}}if(!segs.length)throw new Error('empty');const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));world.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2})));const d0=p=>p[0]*p[0]+p[1]*p[1];[...names.entries()].sort((a,b)=>d0(a[1])-d0(b[1])).slice(0,45).forEach(([nm,m])=>{const s=label(nm,'rgba(20,90,160,.9)',3);s.position.set(m[0],10,m[1]);world.add(s)});sh.sort((a,b)=>d0(a)-d0(b));sh.slice(0,80).forEach(p=>{const b=mk(new THREE.BoxGeometry(9,6,9),hue(p[2]));b.position.set(p[0],3,p[1]);world.add(b);const s=label(p[2],'rgba(160,60,20,.9)',2.4);s.position.set(p[0],9,p[1]);world.add(s);shops.push(p)});let bi=0,bd=1e18;segs.forEach((s,i)=>{const d=dseg(0,0,s);if(d<bd){bd=d;bi=i}});const s0=segs[bi];x=(s0[0]+s0[2])/2;z=(s0[1]+s0[3])/2;h=Math.atan2(s0[2]-s0[0],s0[3]-s0[1]);v=0;cam.position.set(x-Math.sin(h)*11,5,z-Math.cos(h)*11)}async function start(n){P=PL[n];$('msg').textContent='Loading real map of '+n+'...';try{const d=await load(P[0],P[1]);build(d);$('menu').style.display='none';run=true;$('msg').textContent=''}catch(err){$('msg').textContent='Could not load map data. Check your internet and try again.'}}function hud(){let rb=1e18,rn='',sb=1e18,sn='';for(const s of segs){const d=dseg(x,z,s);if(d<rb){rb=d;rn=s[4]}}for(const s of shops){const d=(s[0]-x)**2+(s[1]-z)**2;if(d<sb){sb=d;sn=s[2]}}$('road').textContent=rb<225?rn:'Off road';$('near').textContent=sb<3600?'Near: '+sn:'';$('spd').textContent=Math.round(Math.abs(v)*3.6)+' km/h'}let last=performance.now();function tick(now){requestAnimationFrame(tick);const dt=Math.min(0.05,(now-last)/1000);last=now;if(run){if(K.g)v+=(v<0?20:11)*dt;else if(K.b)v-=(v>0?22:6)*dt;else{const f=4*dt;v=Math.abs(v)<f?0:v-Math.sign(v)*f}v=Math.max(-8,Math.min(28,v));const st=K.l-K.r;if(Math.abs(v)>0.3)h+=st*1.5*dt*Math.sign(v)*Math.min(1,Math.abs(v)/5);x+=Math.sin(h)*v*dt;z+=Math.cos(h)*v*dt;car.position.set(x,0,z);car.rotation.y=h;const fx=Math.sin(h),fz=Math.cos(h),k=Math.min(1,dt*5);cam.position.x+=(x-fx*11-cam.position.x)*k;cam.position.z+=(z-fz*11-cam.position.z)*k;cam.position.y=5;cam.lookAt(x+fx*5,1,z+fz*5);if(++fr%6===0)hud()}ren.render(scene,cam)}requestAnimationFrame(tick);for(const [id,k] of [['bl','l'],['br','r'],['bg','g'],['bb','b']]){const el=$(id);const on=e=>{e.preventDefault();K[k]=1};const off=e=>{e.preventDefault();K[k]=0};el.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,off))}const KM={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'g',w:'g',ArrowDown:'b',s:'b'};addEventListener('keydown',e=>{if(KM[e.key])K[KM[e.key]]=1});addEventListener('keyup',e=>{if(KM[e.key])K[KM[e.key]]=0});$('mb').onclick=()=>{$('menu').style.display='flex';run=false;K.l=K.r=K.g=K.b=0};for(const n in PL){const b=document.createElement('button');b.textContent=n;b.onclick=()=>start(n);$('pl').appendChild(b)}</script></body></html>
