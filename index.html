NAV.forEach((n,i)=>{const b=document.createElement('button');b.className='nb gl'+(i===0&&!curScr?' on':'');b.textContent=T(n[0]);b.onclick=n[1];nv.appendChild(b)});
$('play').textContent=T(world?'RESUME':'PLAY');$('locb').textContent='📍 '+SV.last+'  ›';
$('dly').innerHTML='🎁 '+T('Daily Rewards')+(dayInfo().can?`<b class='bd'>!</b>`:'');
}
function closeScr(){curScr=null;$('scr').style.display='none';ui()}
function scr(k){curScr=k;let t='',b='';
if(k==='stats'){t='Stats';b=`<div class='cd'>${[[T('Rides'),SV.rides],[T('Earned'),'₹'+fmt(SV.earned)],[T('Distance'),SV.km.toFixed(1)+' km'],[T('Top speed'),Math.round(SV.top)+' km/h'],['Level',SV.lvl],['🪙',fmt(SV.coins)]].map(a=>`<div class='gl'>${a[0]}<b>${a[1]}</b></div>`).join('')}</div>`}
else if(k==='ach'){t='Achievements';b=AD.map(a=>`<div class='ro gl'><span>${SV.ach[a[0]]?'🏆':'🔒'} <b>${a[1]}</b><br><small>${a[2]}</small></span><span>${SV.ach[a[0]]?'✓':'+5 💎'}</span></div>`).join('')}
else if(k==='daily'){t='Daily Rewards';const d=dayInfo();b=`<div class='cd'>${[1,2,3,4,5,6,7].map(i=>{const dn=d.can?i<d.day:i<=d.day;return `<div class='dt gl${dn?' done':''}${d.can&&i===d.day?' now':''}'>${T('Day')} ${i}<b>🪙 ${i*500}</b>${i===7?'+10 💎':''}${dn?'✓':''}</div>`}).join('')}</div><p><button class='sg on' data-a='claim' ${d.can?'':'disabled'}>${d.can?T('Claim')+' 🪙 '+d.day*500:T('Claimed today')}</button></p>`}
else{t='Settings';const sg=(key,o)=>o.map(a=>`<button class='sg${SV.set[key]===a[0]?' on':''}' data-k='${key}' data-v='${a[0]}'>${a[1]}</button>`).join('');
b=`<div class='ro gl'><span>${T('Player name')}: <b>${esc(SV.name)}</b></span><button class='sg' data-a='name'>${T('Change')}</button></div><div class='ro gl'><span>${T('Language')}</span><span>${sg('lang',[['en','English'],['ta','தமிழ்']])}</span></div><div class='ro gl'><span>${T('Graphics')}</span><span>${sg('gfx',[['low',T('Low')],['med',T('Medium')],['high',T('High')]])}</span></div><div class='ro gl'><span>${T('Steering sensitivity')} <b id='sv'>${SV.set.sens.toFixed(1)}</b></span><input type='range' id='sens' min='0.5' max='1.5' step='0.1' value='${SV.set.sens}'></div><div class='ro gl'><span>${T('Reset progress')}</span><button class='sg' data-a='reset'>${T('Reset progress')}</button></div>`}
const el=$('scr');el.innerHTML=`<div class='sh'><button class='nb gl' data-a='back'>← ${T('Back')}</button><h2>${T(t)}</h2></div>${b}`;el.style.display='block';ui()}
$('scr').addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const D=el.dataset;
if(D.a==='back'){closeScr();return}
if(D.k){SV.set[D.k]=D.v;if(D.k==='lang'&&LANG!==D.v)$('lg').onclick();if(D.k==='gfx')applyGfx();save();scr(curScr)}
else if(D.a==='name'){const n=prompt(T('Player name'),SV.name);if(n&&n.trim()){SV.name=n.trim().slice(0,20);save();scr(curScr)}}
else if(D.a==='reset'){if(confirm('Reset all progress?')){Object.assign(SV,JSON.parse(JSON.stringify(DEF)));SV.own=['taxi'];SV.car='taxi';SV.col={};CAR=carOf('taxi');look('taxi');save();applyGfx();if(LANG!=='en')$('lg').onclick();scr(curScr)}}
else if(D.a==='claim'){const d=dayInfo();if(d.can){SV.coins+=d.day*500;if(d.day===7)SV.gems+=10;SV.streak=d.day;SV.lastDaily=today();save();scr('daily')}}});
$('scr').addEventListener('input',e=>{if(e.target.id==='sens'){SV.set.sens=+e.target.value;$('sv').textContent=SV.set.sens.toFixed(1);save()}});
function openMap(){$('msg').textContent='';$('menu').style.display='flex'}
$('mback').onclick=()=>{$('menu').style.display='none'};
$('locb').onclick=openMap;
$('dly').onclick=()=>scr('daily');
function showHome(){chk();document.body.classList.add('im');$('home').style.display='block';ui()}
function hideHome(){document.body.classList.remove('im');$('home').style.display='none';$('scr').style.display='none';curScr=null}
$('play').onclick=async()=>{if(world){hideHome();run=true;return}$('hmsg').textContent=T('Loading...');await start(SV.last);$('hmsg').textContent=run?'':$('msg').textContent};
$('mb').onclick=()=>{run=false;K.l=K.r=K.g=K.b=0;save();showHome()};

const G={on:false,a:0,y:2.4,d:8,dr:0,auto:true};
Object.assign(TD,{'Garage':'கராஜ்','Car Shop':'கார் கடை','Buy':'வாங்கு','Select':'தேர்வு','Drive':'ஓட்டு','Owned':'சொந்தம்','Selected':'தேர்ந்தெடுக்கப்பட்டது','Front':'முன்','Side':'பக்கம்','Rear':'பின்','Acceleration':'முடுக்கம்','Handling':'கையாளுதல்','Colour':'நிறம்','Not enough coins':'நாணயங்கள் போதாது'});
const CARS=[
{id:'taxi',n:'City Taxi',p:0,col:0xffc400,top:24,acc:13,hd:1,sc:[1,1,1],cl:'Starter'},
{id:'hatch',n:'Hatchback',p:5000,col:0x2b6cb0,top:26,acc:14,hd:1.1,sc:[0.9,0.95,0.88],cl:'Compact'},
{id:'sedan',n:'Executive Sedan',p:12000,col:0xf2f2f2,top:28,acc:14.5,hd:1,sc:[1,1,1.05],cl:'Sedan'},
{id:'suv',n:'SUV',p:20000,col:0x2f9e44,top:27,acc:13,hd:0.9,sc:[1.1,1.18,1.08],cl:'SUV'},
{id:'sport',n:'Sports Coupe',p:35000,col:0xe03131,top:36,acc:19,hd:1.15,sc:[1.05,0.82,1.05],cl:'Sports'}];
const COLS=[0xffc400,0xf2f2f2,0xe03131,0x2b6cb0,0x222222,0x2f9e44];
const carOf=id=>CARS.find(c=>c.id===id)||CARS[0];
let CAR=carOf(SV.car),gm='garage',gi=0,gx=0,gy=0;
function look(id){const c=carOf(id);car.children[0].material.color.setHex(SV.col[id]!==undefined?SV.col[id]:c.col);car.scale.set(c.sc[0],c.sc[1],c.sc[2]);car.children[car.children.length-1].visible=id==='taxi'}
function glist(){return gm==='garage'?CARS.filter(c=>SV.own.includes(c.id)):CARS}
function openGar(m){gm=m;const l=glist();gi=Math.max(0,l.findIndex(c=>c.id===SV.car));if(m==='shop'){const u=l.findIndex(c=>!SV.own.includes(c.id));if(u>=0)gi=u}G.on=true;G.auto=true;G.d=8;G.y=2.4;G.a=(world?car.rotation.y:0)+0.7;$('home').style.display='none';$('scr').style.display='none';$('gar').style.display='block';grender()}
function closeGar(go){G.on=false;look(SV.car);$('gar').style.display='none';showHome();if(go){if(world){hideHome();run=true}else $('play').onclick()}}
function grender(){const l=glist(),c=l[gi],own=SV.own.includes(c.id);look(c.id);
$('gt').textContent=T(gm==='garage'?'Garage':'Car Shop');$('gcur').textContent='🪙 '+fmt(SV.coins);$('gback').textContent='← '+T('Back');$('vf').textContent=T('Front');$('vs').textContent=T('Side');$('vr').textContent=T('Rear');
const bar=(k,v)=>`<div>${T(k)}</div><div class='bar'><i style='width:${Math.min(100,v*100)}%'></i></div>`;
const cur=SV.col[c.id]!==undefined?SV.col[c.id]:c.col;
let a;
if(!own)a=SV.coins>=c.p?`<button class='sg on gact' data-g='buy'>${T('Buy')} 🪙 ${fmt(c.p)}</button>`:`<button class='sg gact' disabled>${T('Not enough coins')} (🪙 ${fmt(c.p)})</button>`;
else a=SV.car!==c.id?`<button class='sg on gact' data-g='sel'>${T('Select')}</button>`:`<div class='sel'>✓ ${T('Selected')}</div>`;
const sw=own?`<div>${T('Colour')}</div>`+COLS.map(k=>`<button class='sw${k===cur?' on':''}' style='background:#${k.toString(16).padStart(6,'0')}' data-c='${k}'></button>`).join(''):'';
$('gp').innerHTML=`<h3>${c.n}</h3><small>${c.cl}${own?' • '+T('Owned'):''}</small>${bar('Top speed',c.top/40)}${bar('Acceleration',c.acc/20)}${bar('Handling',c.hd/1.2)}<div>${Math.round(c.top*3.6)} km/h</div>${sw}<div style='margin-top:10px'>${a}${own?`<button class='sg on gact' data-g='drive' style='margin-top:6px'>${T('Drive')}</button>`:''}</div>`}
$('gar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset,l=glist(),c=l[gi];
if(b.id==='gback'){closeGar(false);return}
if(b.id==='gprev'||b.id==='gnext'){gi=(gi+l.length+(b.id==='gnext'?1:-1))%l.length;grender();return}
if(D.v!==undefined){G.a=car.rotation.y+(+D.v);G.auto=false;return}
if(D.c){SV.col[c.id]=+D.c;save();grender();return}
if(D.g==='buy'){if(SV.coins>=c.p){SV.coins-=c.p;SV.own.push(c.id);SV.car=c.id;CAR=c;chk();save()}grender();return}
if(D.g==='sel'){SV.car=c.id;CAR=c;save();grender();return}
if(D.g==='drive'){SV.car=c.id;CAR=c;save();closeGar(true)}});
$('gar').addEventListener('pointerdown',e=>{if(e.target.closest('button,#gp'))return;G.dr=1;G.auto=false;gx=e.clientX;gy=e.clientY});
addEventListener('pointermove',e=>{if(!G.dr)return;G.a-=(e.clientX-gx)*0.012;G.y=Math.max(1,Math.min(6,G.y+(e.clientY-gy)*0.015));gx=e.clientX;gy=e.clientY});
addEventListener('pointerup',()=>{G.dr=0});addEventListener('pointercancel',()=>{G.dr=0});
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});setInterval(save,5000);
$('menu').style.display='none';look(SV.car);applyGfx();if(SV.set.lang==='ta'&&LANG!=='ta')lgOld();showHome();
</script></body></html>
